[project]
name = "utils"
version = "0.1.0"
description = "Add your description here"
requires-python = ">=3.13"
dependencies = [
    "requests>=2.34.2",
]

[dependency-groups]
dev = [
    "pytest>=9.2.0",
    "ruff>=0.17.3",
    "ty>=0.0.95",
]

[tool.ruff]
line-length = 120

[tool.ruff.lint]
ignore = ["BLE001", "DTZ005"]

[tool.pytest]
addopts = ["--doctest-modules"]
